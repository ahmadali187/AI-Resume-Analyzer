services:
  - type: web
    name: ai-resume-analyzer
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: resume-analyzer-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: resume-analyzer-db
    databaseName: resume_analyzer
    user: resume_user
