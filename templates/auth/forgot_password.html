{% extends "base.html" %}

{% block title %}Forgot Password - {{ app_name }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="glass-card p-4 p-md-5">
                <h3 class="text-white fw-bold mb-2 text-center">Reset Password</h3>
                <p class="text-muted text-center small mb-4">Enter your email to receive a password reset link</p>
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-4">
                        <label class="form-label text-light">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                    </div>
                    <button type="submit" class="btn btn-primary-gradient w-100 py-2">Send Reset Link</button>
                </form>
                <p class="text-center text-muted small mt-4 mb-0">
                    <a href="{{ url_for('auth.login') }}" class="text-primary text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Back to Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
