{% extends "base.html" %}

{% block title %}Register - {{ app_name }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="glass-card p-4 p-md-5">
                <h1 class="h3 text-white fw-bold mb-2 text-center">Create Your Account</h1>
                <p class="text-muted text-center small mb-4">Start optimizing your resume for ATS systems</p>
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="regName" class="form-label text-light">Full Name</label>
                        <input type="text" id="regName" name="name" class="form-control" placeholder="John Doe" required>
                    </div>
                    <div class="mb-3">
                        <label for="regEmail" class="form-label text-light">Email Address</label>
                        <input type="email" id="regEmail" name="email" class="form-control" placeholder="name@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="regPassword" class="form-label text-light">Password</label>
                        <input type="password" id="regPassword" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <div class="mb-4">
                        <label for="regConfirmPassword" class="form-label text-light">Confirm Password</label>
                        <input type="password" id="regConfirmPassword" name="confirm_password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary-gradient w-100 py-2">Create Account</button>
                </form>
                <p class="text-center text-muted small mt-4 mb-0">
                    Already have an account? <a href="{{ url_for('auth.login') }}" class="text-primary text-decoration-none fw-semibold">Sign In</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
