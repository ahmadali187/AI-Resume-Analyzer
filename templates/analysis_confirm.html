{% extends "base.html" %}

{% block title %}Confirm Analysis - {{ app_name }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="glass-card p-5 text-center">
                <div class="bg-primary bg-opacity-20 text-primary p-4 rounded-circle d-inline-block mb-3">
                    <i class="fa-solid fa-wand-magic-sparkles fa-3x"></i>
                </div>
                <h3 class="text-white fw-bold mb-2">Run Groq ATS Analysis</h3>
                <p class="text-muted mb-4">Analyze <strong>{{ resume.filename }}</strong> for ATS scores, grammar, formatting, and weak/strong bullet statements.</p>
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="btn btn-primary-gradient btn-lg w-100 py-3 text-uppercase fw-bold"><i class="fa-solid fa-play me-2"></i>Start AI Analysis</button>
                </form>
                <a href="{{ url_for('resume.detail', resume_id=resume.id) }}" class="btn btn-link text-muted mt-3 text-decoration-none small">Cancel</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
