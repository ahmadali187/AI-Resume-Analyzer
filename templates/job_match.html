{% extends "base.html" %}

{% block title %}Job Description Matcher - {{ app_name }}{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="glass-card p-4 p-md-5">
                <h3 class="text-white fw-bold mb-2 text-center"><i class="fa-solid fa-bullseye text-warning me-2"></i>Job Description Matcher</h3>
                <p class="text-muted text-center small mb-4">Paste the target Job Description to compare candidate match % and discover missing skills.</p>

                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    
                    <div class="mb-3">
                        <label class="form-label text-light">Select Candidate Resume</label>
                        <select name="resume_id" class="form-select" required>
                            <option value="" disabled selected>-- Choose uploaded resume --</option>
                            {% for r in resumes %}
                            <option value="{{ r.id }}">{{ r.filename }} (Uploaded {{ r.uploaded_at.strftime('%b %d') }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label text-light">Job Title / Role</label>
                            <input type="text" name="title" class="form-control" placeholder="e.g. Senior Python Engineer">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-light">Company Name</label>
                            <input type="text" name="company" class="form-control" placeholder="e.g. Google">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-light">Paste Job Description Text</label>
                        <textarea name="content" class="form-control" rows="8" placeholder="Paste full job description responsibilities, requirements, and tech stack here..." required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary-gradient w-100 py-3 text-uppercase fw-bold"><i class="fa-solid fa-calculator me-2"></i>Calculate Match & Missing Skills</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
