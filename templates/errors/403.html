{% extends "base.html" %}

{% block title %}403 Access Denied - {{ app_name }}{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="glass-card p-5 d-inline-block col-md-6">
        <div class="mb-3">
            <i class="fa-solid fa-user-shield text-danger" style="font-size: 64px;"></i>
        </div>
        <h1 class="display-1 text-danger fw-bold mb-0">403</h1>
        <h3 class="text-white fw-bold mb-3">Access Denied</h3>
        <p class="text-muted mb-4">You do not have permission to access this resource. If you believe this is an error, please contact your administrator.</p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary-gradient px-4">Go to Dashboard</a>
            <a href="{{ url_for('main.index') }}" class="btn btn-outline-light rounded-pill px-4">Return Home</a>
        </div>
    </div>
</div>
{% endblock %}
