{% extends "base.html" %}

{% block title %}404 Page Not Found - {{ app_name }}{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="glass-card p-5 d-inline-block col-md-6">
        <h1 class="display-1 text-primary fw-bold mb-0">404</h1>
        <h3 class="text-white fw-bold mb-3">Page Not Found</h3>
        <p class="text-muted mb-4">The page you are looking for might have been removed or is temporarily unavailable.</p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary-gradient px-4">Return Home</a>
    </div>
</div>
{% endblock %}
