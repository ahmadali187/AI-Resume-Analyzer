{% extends "base.html" %}

{% block title %}400 Bad Request - {{ app_name }}{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="glass-card p-5 d-inline-block col-md-6">
        <h1 class="display-1 text-warning fw-bold mb-0">400</h1>
        <h3 class="text-white fw-bold mb-3">Bad Request</h3>
        <p class="text-muted mb-4">The server could not understand the request due to invalid syntax or parameters.</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary-gradient px-4">Return to Dashboard</a>
    </div>
</div>
{% endblock %}
